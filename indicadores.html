<div id="app"></div>
<script>
"use strict";
class Base {
  constructor(app, P, D) {
    this.app = app; this.P = P; this.D = D;
    this.metas = app.metas;
    this.CURSO = app.hoyYm; this.lastCurso = app.hoyD;
    this.MESES = app.mesesDe(P);
    this.ML = {}; this.MN = {};
    var self = this, NL = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    this.MESES.concat([this.prev(this.MESES[0])]).forEach(function (m) { self.ML[m] = NL[self.M(m)]; self.MN[m] = NL[self.M(m)].slice(0, 3).toLowerCase(); });
    this.PAL = ['#D01148', '#80AD36', '#8E1B5A', '#4F7A1E', '#E8799A', '#B5D17A', '#5E0F33', '#2F4A12', '#B07D3A', '#6B7F8E', '#C9A0B4', '#9E9890'];
    this.TC = ['#D01148', '#6E0B2E', '#EE7A9C', '#A8325E', '#43061C', '#C98CA2']; this.TT = ['#80AD36', '#355E12', '#A9CF6A', '#5F8F28', '#22400A', '#8FB07A']; this.TONE = {};
    this.COL = {};
    var ult = this.MESES.length > 1 ? this.MESES[this.MESES.length - 2] : this.MESES[0];
    this.state = { tab: 'mes', mes: ult, emp: 'A', exp: {}, modal: null, hms: this.MESES.slice(-4), hmet: '', cmp: [], cmet: '' };
    this.setup();
  }
  Y(m) { return Math.floor(m / 100); }
  M(m) { return m % 100; }
  prev(m) { return this.M(m) === 1 ? (this.Y(m) - 1) * 100 + 12 : m - 1; }
  dim(m) { return new Date(this.Y(m), this.M(m), 0).getDate(); }
  dt(m, d) { return new Date(this.Y(m), this.M(m) - 1, d); }
  lbl(m) { return (this.ML[m] || '').slice(0, 3) + ' ' + this.Y(m); }
  pad(x) { return (x < 10 ? '0' : '') + x; }
  setState(o) { Object.assign(this.state, o); this.app.procState(this); this.app.render(); }
  col(n) {
    if (!this.COL[n]) { var k = Object.keys(this.COL).length; this.COL[n] = this.PAL[k % this.PAL.length]; }
    return this.COL[n];
  }
  fmt(n, d) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('es-CO', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  }
  pc(v, d) { return v === null || v === undefined ? '—' : this.fmt(v, d === undefined ? 1 : d) + '%'; }
  av(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
  med(a) { var T = a.slice().sort(function (x, y) { return x - y; }); return T.length ? (T.length % 2 ? T[(T.length - 1) / 2] : (T[T.length / 2 - 1] + T[T.length / 2]) / 2) : null; }
  ratio(a, b) { return b ? a / b * 100 : null; }
  vr(cur, prev, kind, dir, lbl) {
    if (cur === null || cur === undefined || prev === null || prev === undefined) return { t: '', c: 'vn' };
    var d, t;
    if (kind === 'pct') { d = cur - prev; t = (d >= 0 ? '▲ ' : '▼ ') + this.fmt(Math.abs(d), 1) + ' pts'; }
    else { if (!prev) return { t: '', c: 'vn' }; d = (cur - prev) / prev * 100; t = (d >= 0 ? '▲ ' : '▼ ') + this.fmt(Math.abs(d)) + '%'; }
    var good = dir === 'down' ? d < 0 : dir === 'up' ? d > 0 : null;
    return { t: t + (lbl ? ' ' + lbl : ''), c: good === null || Math.abs(d) < 0.05 ? 'vn' : good ? 'vg' : 'vb' };
  }
  sem(v, meta, dir) {
    if (meta === null || meta === undefined) return { t: 'Sin meta', c: 'pill na', v: 'vna' };
    if (v === null || v === undefined) return { t: 'Sin datos', c: 'pill na', v: 'vna' };
    var ok = dir === 'le' ? v <= meta : v >= meta;
    var mg = (this.metas.ambar === null || this.metas.ambar === undefined ? 10 : this.metas.ambar) / 100;
    var near = dir === 'le' ? v <= meta * (1 + mg) : v >= meta * (1 - mg);
    if (meta === 0) near = false;
    return ok ? { t: 'Cumple', c: 'pill ok', v: 'vok' } : near ? { t: 'Cerca de la meta', c: 'pill am', v: 'vam' } : { t: 'No cumple', c: 'pill ro', v: 'vro' };
  }
  chips(cur, ops, fn) {
    return ops.map(function (o) {
      var on = Array.isArray(cur) ? (o[0] === '' ? !cur.length : cur.indexOf(o[0]) >= 0) : cur === o[0];
      return { t: (Array.isArray(cur) && on && o[0] !== '' ? '✓ ' : '') + o[1], cls: o[2] ? 'chip dis' : on ? 'chip on' : 'chip', click: function () { if (!o[2]) fn(o[0]); } };
    });
  }
  togArr(k, v) {
    var a = (this.state[k] || []).slice();
    if (v === '') a = []; else { var i = a.indexOf(v); if (i < 0) a.push(v); else a.splice(i, 1); }
    var o = {}; o[k] = a; this.setState(o);
  }

  top: function (backHtml, title, sub) {
    return '<div class="top">' + backHtml + V.logos() +
      '<div class="tt"><b>' + esc(title || 'Indicadores de gestión') + '</b><span>' + esc(sub || 'Logística y Bodega · Contubos · Tecnipapel') + '</span></div>' +
      (App.readonly ? '<span class="mk">COPIA PARA PRESENTAR' + (EMB && EMB.generado ? ' · ' + esc(EMB.generado) : '') + '</span>' :
        '<span class="usr"><b>' + esc(App.user ? App.user.nombre : '') + '</b>' + (App.user && App.user.rol ? ' · ' + esc(App.user.rol) : '') + '</span><button class="btn" onclick="' + on(App.salir) + '">Salir</button>') + '</div>';
  },
  login: function () {
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
    var dots = ''; for (var i = 0; i < Math.max(4, App.pinBuf.length); i++) dots += '<span class="d ' + (App.err ? 'err' : i < App.pinBuf.length ? 'on' : '') + '"></span>';
    return '<div class="lgw"><a href="/" class="lgb">← Volver al portal</a><div class="lgc">' + V.logos() +
      '<div class="lgt">INDICADORES DE GESTIÓN</div><div class="lgs">Logística y Bodega · Portal Logística</div>' +
      '<div class="lgp">Ingresa tu clave personal</div><div class="dots">' + dots + '</div>' +
      '<div class="lge">' + (App.err ? esc(App.err) : App.cargando ? 'Verificando…' : '') + '</div>' +
      '<div class="kp">' + keys.map(function (k) {
        if (k === '') return '<span></span>';
        if (k === 'del') return '<button class="key del" aria-label="Borrar" onclick="' + on(function () { App.tecla('Backspace'); }) + '"><svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h15a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H8l-6-8z"/><path d="M12 7l6 6M18 7l-6 6"/></svg></button>';
        return '<button class="key" onclick="' + on(function () { App.tecla(k); }) + '">' + k + '</button>';
      }).join('') + '</div><div class="lgk">⌨ También puedes escribir tu clave con el teclado del computador</div></div></div>';
  },
  error: function () {
    return V.top('<a href="/" class="btn" style="color:#D01148">← Volver al portal</a>') + '<div class="wrap"><div class="card"><h2>No se pudieron cargar los indicadores</h2><p class="red">' + esc(App.err) + '</p><p>Revise las variables de entorno en Vercel y que cada Sheet esté compartido con la cuenta de servicio.</p><button class="btn pri" onclick="' + on(function () { App.cargar(); }) + '">Reintentar</button></div></div>';
  },
  chips: function (list) { return list.map(function (x) { return '<button class="' + x.cls + '" onclick="' + on(x.click) + '">' + esc(x.t) + '</button>'; }).join(''); },
  toolbar: function (m) {
    var b = '<button class="btn" onclick="' + on(App.excel) + '">Excel</button><button class="btn" onclick="' + on(function () { window.print(); }) + '">PDF</button>';
    if (!App.readonly) {
      b += '<button class="btn" onclick="' + on(App.htmlPresentar) + '">HTML para presentar</button><button class="btn" onclick="' + on(function () { App.view = 'metas'; App.render(); }) + '">⚙ Configurar</button>';
      if (App.cerrado(m)) b += '<button class="btn" onclick="' + on(function () { App.dlg = { t: '¿Reabrir ' + App.mesLbl(m) + '?', body: 'Las cifras volverán a calcularse con los datos actuales de las apps. Queda registro de quién lo reabrió.', input: 'Motivo (obligatorio)', yes: function (txt) { if (!txt) { App.toast('Escriba el motivo'); return; } App.reabrirMes(m, txt); } }; App.render(); }) + '">Reabrir ' + esc(App.mesLbl(m).split(' ')[0].toLowerCase()) + '</button>';
      else if (m < App.hoyYm) b += '<button class="btn pri" onclick="' + on(function () { App.dlg = { t: '¿Cerrar ' + App.mesLbl(m) + '?', body: 'Se congelan los datos de los 4 procesos de ese mes: las cifras ya no cambian aunque después se corrijan registros en las apps. Se puede reabrir dejando registro.', yes: function () { App.cerrarMes(m); } }; App.render(); }) + '">Cerrar ' + esc(App.mesLbl(m).split(' ')[0].toLowerCase()) + '</button>';
    }
    return '<div class="tb noprint">' + b + '</div>';
  },
  dialog: function () {
    var d = App.dlg;
    return '<div class="ov"><div class="md dlg"><h2>' + esc(d.t) + '</h2><p>' + esc(d.body) + '</p>' + (d.input ? '<textarea id="dlgtxt" rows="3" placeholder="' + ats(d.input) + '"></textarea>' : '') +
      '<div class="sino"><button class="si" onclick="' + on(function () { var el = document.getElementById('dlgtxt'); d.yes(el ? el.value.trim() : ''); }) + '">SÍ</button><button class="no" onclick="' + on(function () { App.dlg = null; App.render(); }) + '">NO</button></div></div></div>';
  },
  // ---------------- RESUMEN
  resumen: function () {
    var m = App.G.mes, todos = App.mesesTodos(), err = (App.raw && App.raw.errores) || {};
    var meses = todos.map(function (x) { return { t: App.mesLbl(x).slice(0, 3) + ' ' + Math.floor(x / 100) + (x === App.hoyYm ? ' · en curso' : '') + (App.cerrado(x) ? ' ✓' : ''), cls: x === m ? 'chip on' : 'chip', click: function () { App.G.mes = x; App.render(); } }; });
    var emps = [['A', 'Ambas'], ['C', 'Contubos'], ['T', 'Tecnipapel']].map(function (e) { return { t: e[1], cls: App.G.emp === e[0] ? 'chip on em' + e[0] : 'chip', click: function () { App.G.emp = e[0]; App.render(); } }; });
    var c = App.cierre(m), h = '';
    h += V.top(App.readonly ? '' : '<a href="/" class="btn" style="color:#D01148">← Volver al portal</a>');
    h += '<div class="wrap"><div class="hd"><h1>Resumen · ' + esc(App.mesLbl(m)) + '</h1>' + V.toolbar(m) + '</div>';
    h += '<div class="fil"><span class="lbl">Mes</span><div class="chw">' + V.chips(meses) + '</div><span class="lbl">Empresa</span><div class="chw">' + V.chips(emps) + '</div></div>';
    if (c) h += '<div class="note">✓ <b>' + esc(App.mesLbl(m)) + ' cerrado</b> el ' + esc(c.fh) + ' por ' + esc(c.usuario) + ': las cifras son la foto del cierre.' + (App.hoyYm > 0 ? '' : '') + '</div>';
    else if (m === App.hoyYm) h += '<div class="note w">' + esc(App.mesLbl(m)) + ' en curso: cifras del 01 al ' + String(App.hoyD).padStart(2, '0') + '.</div>';
    h += '<div class="g2r">';
    PROCS.forEach(function (p) {
      var I = App.inst[p[0]];
      if (!I) { h += '<div class="pc"><b style="font-size:16px">' + esc(p[1]) + '</b><div class="red">No se pudieron leer los datos: ' + esc(err[p[0]] || 'sin datos') + '</div></div>'; return; }
      I.state.mes = I.MESES.indexOf(m) >= 0 ? m : I.state.mes;
      if (p[0] !== 'imp') I.state.emp = App.G.emp;
      var r;
      try { r = I.resumen(); } catch (e) { h += '<div class="pc"><b>' + esc(p[1]) + '</b><div class="red">Error: ' + esc(e.message) + '</div></div>'; return; }
      h += '<button class="pc band ' + r.sm.c.replace('pill ', 'b') + '" onclick="' + on(function () { App.abrirProc(p[0]); }) + '"><div class="pch"><div><b style="font-size:16px">' + esc(r.t) + '</b><div class="ks">' + esc(r.sub) + '</div></div><span class="' + r.sm.c + '">' + esc(r.sm.t) + '</span></div>' +
        '<div><span class="kt">' + esc(r.kt) + '</span><div class="pcv"><b class="' + r.sm.v + '">' + esc(r.v) + '</b><span class="' + r.x.c + '">' + esc(r.x.t) + '</span></div><span class="ks">' + esc(r.det) + '</span></div>' +
        '<div>' + r.sec.map(function (s) { return '<div class="sec"><span><i class="dot ' + s[0].replace('pill ', 'd') + '"></i>' + esc(s[1]) + '</span><b>' + esc(s[2]) + '</b></div>'; }).join('') + '</div>' +
        '<span class="lnk2">Ver proceso ›</span></button>';
    });
    h += '</div><div class="ks" style="margin-top:12px;line-height:1.5">Verde = cumple la meta · Ámbar = no cumple pero está a menos del ' + esc(App.metas.ambar) + '% de la meta · Rojo = no cumple · Gris = sin meta. Toque un proceso para ver sus pestañas Mes, Histórico e Indicadores de gestión.</div></div>';
    return h;
  },
  // ---------------- METAS Y CIERRES
  metas: function () {
    var h = V.top('<button class="btn" style="color:#D01148" onclick="' + on(function () { App.view = 'resumen'; App.render(); }) + '">← Volver al resumen</button>', 'Configurar metas');
    h += '<div class="wrap"><div class="card"><div class="ct"><span>Metas de los indicadores</span><i>se guardan en la hoja Metas del Sheet del portal</i></div><table class="mt">';
    METAS_DEF.forEach(function (d) { var v = App.metas[d[0]]; h += '<tr><td>' + esc(d[1]) + '</td><td><input id="meta_' + d[0] + '" inputmode="decimal" value="' + ats(v === null || v === undefined ? '' : v) + '"></td></tr>'; });
    h += '</table><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn pri" onclick="' + on(App.guardarMetas) + '">Guardar metas</button><button class="btn" onclick="' + on(function () { App.view = 'resumen'; App.render(); }) + '">Cancelar</button></div></div>';
    var hist = (App.portal.hist || []).slice().reverse();
    h += '<div class="card" style="margin-top:12px"><div class="ct"><span>Historial de cierres de mes</span><i>cada cierre y cada reapertura con quién y cuándo</i></div>' + (hist.length ? '<div class="scr"><table><thead><tr><th>Mes</th><th>Acción</th><th>Usuario</th><th>Fecha</th><th>Nota</th></tr></thead><tbody>' + hist.map(function (x) { return '<tr><td>' + esc(App.mesLbl(Number(x.mes))) + '</td><td><span class="' + (x.estado === 'Cerrado' ? 'pill ok' : 'pill am') + '">' + esc(x.estado) + '</span></td><td>' + esc(x.usuario) + '</td><td>' + esc(x.fh) + '</td><td>' + esc(x.nota) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="vac">Todavía no se ha cerrado ningún mes.</div>') + '</div>';
    h += '<div class="note" style="margin-top:12px">Los usuarios y sus PIN, y las equivalencias de nombres (clientes y operarios escritos de varias formas), se editan directamente en las hojas <b>Usuarios</b> y <b>Equivalencias</b> del Sheet INDICADORES PORTAL.</div></div>';
    return h;
  },
  // ---------------- PROCESO
  proc: function () {
    var I = App.inst[App.proc], v = I.renderVals(), s = I.state, p = PROCS.filter(function (x) { return x[0] === App.proc; })[0];
    var h = V.top('<button class="btn" style="color:#D01148" onclick="' + on(function () { App.view = 'resumen'; I.state.modal = null; window.scrollTo(0, 0); App.render(); }) + '">← Volver al resumen</button>', p[1], p[2]);
    h += '<div class="wrap"><div class="hd"><div class="vsel noprint">' + v.tabs.map(function (x) { return '<button class="' + x.cls + '" onclick="' + on(x.click) + '">' + esc(x.t) + '</button>'; }).join('') + '</div>' + V.toolbar(s.mes) + '</div>';
    h += '<div class="prt">' + esc(p[1]) + ' · ' + esc(I.lbl(s.mes)) + '</div>';
    if (v.aviso) h += '<div class="' + v.avisoCls + '">' + esc(v.aviso) + '</div>';
    if (v.exclTxt) h += '<div class="note w noprint">' + esc(v.exclTxt) + ' <button class="lnk" onclick="' + on(v.verExcl) + '">Ver excluidos ›</button></div>';
    h += '<div class="fil noprint">' + v.fRows.map(function (fr) { return '<span class="lbl">' + esc(fr.l) + '</span><div class="chw">' + V.chips(fr.chips) + (fr.nota ? '<span class="ks">' + esc(fr.nota) + '</span>' : '') + '</div>'; }).join('') + (v.hayFil ? '<span></span><div><button class="lnk" onclick="' + on(v.quitar) + '">✕ Quitar filtros</button></div>' : '') + '</div>';
    if (v.isMes) h += V.tabMes(v);
    if (v.isHist) h += V.tabHist(v);
    if (v.isGest) h += V.tabGest(v);
    h += '</div>';
    if (v.hasModal) h += V.modal(v);
    return h;
  },
  bar: function (b) {
    return '<button class="bar' + (b.pt ? ' wp' : '') + (b.sep ? ' sep' : '') + '" onclick="' + on(b.click) + '"><span class="n">' + esc(b.n) + '</span><span class="rr"><span class="r" style="width:' + b.w + '%;background:' + b.col + '"></span>' + (b.w2 && b.w2 !== '0' ? '<span class="r r2" style="width:' + b.w2 + '%;background:' + b.col2 + '"></span>' : '') + (b.mw ? '<span class="mline" style="left:' + b.mw + '%"></span>' : '') + '</span><span class="v">' + esc(b.v) + (b.pt ? ' <span class="' + b.pc + '">' + esc(b.pt) + '</span>' : '') + '</span></button>';
  },
  leg: function (L) { return '<div class="legs">' + L.map(function (l) { return '<span><i style="background:' + l.col + '"></i>' + esc(l.n) + '</span>'; }).join('') + '</div>'; },
  table: function (head, rows, first) {
    return '<div class="scr"><table><thead><tr>' + head.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  },
  cmpCard: function (v, gest) {
    var h = '<div class="card">';
    if (!gest) {
      h += '<div class="ct"><span>' + esc(v.cTitle) + '</span><i>toque una barra o una fila para ver el detalle</i></div><div class="chw" style="margin:4px 0 8px"><span class="lbl">Ver</span>' + V.chips(v.cMetChips) + '</div>';
      if (v.cNone) h += '<div class="vac">' + esc(v.cNoneTxt) + '</div>';
      h += v.cBars.map(V.bar).join('');
      if (v.cMore) h += '<button class="mas" onclick="' + on(v.cTog) + '">' + esc(v.cMore) + '</button>';
      if (v.cMeta) h += '<div class="nt">' + esc(v.cMeta) + '</div>';
      h += '<div style="margin-top:10px">' + V.table([v.cHead].concat(v.cCols).concat([v.cVarHead]), v.cRows.map(function (r) { return '<tr><td><button class="lnk" onclick="' + on(r.click) + '"><i class="sw" style="background:' + r.col + '"></i>' + esc(r.n) + '</button></td>' + r.cells.map(function (c) { return '<td><span class="' + c.c + '">' + esc(c.v) + '</span></td>'; }).join('') + '<td><span class="' + r.vc + '">' + esc(r.vt) + '</span></td></tr>'; })) + '</div>';
    } else {
      h += '<div class="ct"><span>' + esc(v.gmTitle) + '</span><i>semáforo de cada grupo contra las metas · toque un grupo para ver el detalle</i></div>';
      if (v.cNone) h += '<div class="vac">' + esc(v.cNoneTxt) + '</div>';
      h += V.table([v.cHead].concat(v.gmCols).concat(['Metas cumplidas']), v.gmRows.map(function (r) { return '<tr><td><button class="lnk" onclick="' + on(r.click) + '"><i class="sw" style="background:' + r.col + '"></i>' + esc(r.n) + '</button></td>' + r.cells.map(function (c) { return '<td><span class="' + c.c + '">' + esc(c.v) + '</span></td>'; }).join('') + '<td><b>' + esc(r.ok) + '</b></td></tr>'; }));
      h += '<div class="nt">Los grupos salen de "Comparar por" (arriba). Ordenados de peor a mejor cumplimiento.</div>';
    }
    return h + '</div>';
  },
  tabMes: function (v) {
    var h = '<div class="ks noprint" style="margin:2px">Toque cualquier tarjeta, barra, celda o fila para ver los registros.</div>';
    h += '<div class="g4">' + v.kpis.map(function (k) { return '<button class="k" onclick="' + on(k.click) + '"><span class="kt">' + esc(k.t) + '</span><span class="kv">' + esc(k.v) + '</span><span class="ks">' + esc(k.s) + '</span><span class="' + k.vc + '">' + esc(k.vt) + '</span></button>'; }).join('') + '</div>';
    h += V.cmpCard(v, false);
    h += '<div class="g2">' + v.charts.map(function (c) {
      return '<div class="' + c.cls + '"><div class="ct"><span>' + esc(c.t) + '</span><i>' + esc(c.i) + '</i></div>' + (c.hasLeg ? V.leg(c.leg) : '') + c.items.map(V.bar).join('') + (c.empty ? '<div class="vac">Sin datos con estos filtros</div>' : '') + (c.hasMore ? '<button class="mas" onclick="' + on(c.tog) + '">' + esc(c.more) + '</button>' : '') + (c.nt ? '<div class="nt">' + esc(c.nt) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
    (v.grids || []).forEach(function (g) {
      var cols = 'grid-template-columns:' + g.lw + 'px repeat(' + g.nc + ',minmax(0,1fr))';
      h += '<div class="card"><div class="ct"><span>' + esc(g.t) + '</span><i>' + esc(g.i) + '</i></div><div class="scr"><div style="min-width:' + (g.minw || 0) + 'px"><div class="gr" style="' + cols + '"><span></span>' + g.cols.map(function (c) { return '<span class="gh">' + esc(c) + '</span>'; }).join('') + '</div>' +
        g.rows.map(function (r) { return '<div class="gr" style="' + cols + ';margin-top:3px"><span class="gl">' + esc(r.n) + '</span>' + r.cells.map(function (c) { return '<button class="gc" style="background:' + c.bg + ';color:' + c.fg + '" aria-label="' + ats(c.al) + '" title="' + ats(c.al) + '" onclick="' + on(c.click) + '">' + esc(c.t) + '</button>'; }).join('') + '</div>'; }).join('') + '</div></div><div class="nt">' + esc(g.nt) + '</div></div>';
    });
    (v.mTables || []).forEach(function (t) { h += V.tcard(t); });
    return h;
  },
  tcard: function (t) {
    return '<div class="card"><div class="ct"><span>' + esc(t.t) + '</span><i>' + esc(t.i) + '</i></div>' + V.table(t.head, t.rows.map(function (r) { return '<tr><td><button class="' + r.nc + '" onclick="' + on(r.click) + '">' + esc(r.n) + '</button></td>' + r.cells.map(function (c) { return '<td><span class="' + c.c + '">' + esc(c.v) + '</span></td>'; }).join('') + '</tr>'; })) + (t.hasMore ? '<button class="mas" onclick="' + on(t.tog) + '">' + esc(t.more) + '</button>' : '') + '</div>';
  },
  svg: function (c, big) {
    var h = '<svg viewBox="' + c.vb + '" width="100%" role="img" aria-label="' + ats(c.t) + '">';
    c.grid.forEach(function (g) { h += '<line x1="' + g.x1 + '" x2="' + g.x2 + '" y1="' + g.y + '" y2="' + g.y + '" stroke="#ECE9E2"/><text x="' + g.tx + '" y="' + g.ty + '" font-size="11" fill="#8a857c" text-anchor="end">' + esc(g.t) + '</text>'; });
    c.xl.forEach(function (x) { h += '<text x="' + x.x + '" y="' + x.y + '" font-size="12.5" font-weight="700" fill="#333" text-anchor="middle">' + esc(x.t) + '</text>'; });
    (c.ref || []).forEach(function (r) { h += '<line x1="' + r.x1 + '" x2="' + r.x2 + '" y1="' + r.y + '" y2="' + r.y + '" stroke="#C98A1B" stroke-width="2" stroke-dasharray="7 6"/><text x="' + r.tx + '" y="' + r.ty + '" font-size="11.5" font-weight="800" fill="#9A6A10" text-anchor="end">' + esc(r.t) + '</text>'; });
    c.lines.forEach(function (l) { if (l.pts) h += '<polyline points="' + l.pts + '" fill="none" stroke="' + l.col + '" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>'; });
    c.dots.forEach(function (d) { h += '<circle cx="' + d.x + '" cy="' + d.y + '" r="' + (big ? 5 : 4.5) + '" fill="#fff" stroke="' + d.col + '" stroke-width="3"/>' + (d.t ? '<text x="' + d.x + '" y="' + d.ty + '" font-size="11.5" font-weight="800" fill="#333" text-anchor="middle">' + esc(d.t) + '</text>' : ''); });
    return h + '</svg>';
  },
  tabHist: function (v) {
    if (v.hEmpty) return '<div class="card vac">Escoja al menos un mes.</div>';
    var h = '<div class="g4">' + v.hk.map(function (x) { return '<div class="k nc"><span class="kt">' + esc(x.t) + '</span><span class="kv">' + esc(x.v) + '</span><span class="ks">' + esc(x.s) + '</span></div>'; }).join('') + '</div>';
    h += '<div class="card"><div class="ct"><span>' + esc(v.hTitle) + '</span><i>toque un mes para abrirlo en la pestaña Mes</i></div>' + V.leg(v.hRows.map(function (r) { return { n: r.n, col: r.col }; })) +
      '<div class="hcols">' + v.hCols.map(function (c) { return '<button class="hcol" onclick="' + on(c.click) + '"><span class="hbs">' + c.bars.map(function (b) { return '<span class="hbw' + (b.gap ? ' gp' : '') + '"><span class="hv">' + esc(b.t) + '</span><span class="hb" style="height:' + b.h + 'px;background:' + b.col + '"></span></span>'; }).join('') + '</span><span class="hl">' + esc(c.lbl) + '</span></button>'; }).join('') + '</div></div>';
    h += '<div class="card"><div class="ct"><span>' + esc(v.lc.t) + '</span><i>' + esc(v.lc.i) + '</i></div>' + V.leg(v.lc.leg) + V.svg(v.lc, true) + '<div class="nt">Cada curva es un grupo de "Comparar por". La línea punteada es la meta.</div></div>';
    h += '<div class="lbl" style="margin:4px 2px 0">Todas las métricas · mismas curvas</div><div class="g2">' + v.lcm.map(function (c) { return '<div class="card"><div class="ct"><span>' + esc(c.t) + '</span><button class="lnk noprint" onclick="' + on(c.ver) + '">Ver en grande ›</button></div>' + V.svg(c, false) + '</div>'; }).join('') + '</div>';
    h += '<div class="card"><div class="ct"><span>' + esc(v.hTitle) + ' · tabla</span><i>variación del primer al último mes escogido</i></div>' + V.table(['Serie'].concat(v.hHead).concat(['Var.']), v.hRows.map(function (r) { return '<tr><td><i class="sw" style="background:' + r.col + '"></i><b>' + esc(r.n) + '</b></td>' + r.cells.map(function (c) { return '<td>' + esc(c.v) + '</td>'; }).join('') + '<td><span class="' + r.vc + '">' + esc(r.vt) + '</span></td></tr>'; })) + '</div>';
    h += '<div class="note">Los meses se calculan directamente de los Sheets de las apps. Los meses cerrados (✓) usan la foto del cierre.</div>';
    return h;
  },
  tabGest: function (v) {
    var h = '<div class="lbl" style="margin:2px">' + esc(v.gTitle) + '</div><div class="g3">' + v.gk.map(function (x) {
      return '<button class="gk band ' + x.pcls.replace('pill ', 'b') + '" onclick="' + on(x.click) + '"><span class="kt">' + esc(x.t) + '</span><span class="gkv"><span class="' + x.vcls + '">' + esc(x.v) + '</span><span class="' + x.pcls + '">' + esc(x.pt) + '</span></span><span class="ks"><b>' + esc(x.meta) + '</b> · ' + esc(x.cmp) + ' <span class="' + x.vc + '">' + esc(x.vt) + '</span></span><span class="gke">' + esc(x.exp) + '</span></button>';
    }).join('') + '</div>';
    h += V.cmpCard(v, true);
    (v.gTables || []).forEach(function (t) { h += V.tcard(t); });
    h += '<div class="note">Semáforo: verde cumple · ámbar no cumple pero está a menos del ' + esc(App.metas.ambar) + '% de la meta · rojo no cumple · gris sin meta. Las metas se cambian en ⚙ Configurar.</div>';
    return h;
  },
  modal: function (v) {
    var I = App.inst[App.proc];
    var close = function () { I.setState({ modal: null }); };
    return '<div class="ov" onclick="if(event.target===this)' + on(close) + '"><div class="md"><button class="btn" style="color:#D01148;margin-bottom:10px" onclick="' + on(close) + '">← Volver</button><h2>' + esc(v.mTitle) + '</h2><div class="sub">' + esc(v.mSub) + '</div><div class="card scr"><table><thead><tr>' + v.mHead.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
      v.mRows.map(function (r) { return '<tr class="' + r.rc + '">' + r.cells.map(function (c) { return '<td><span class="' + c.c + '">' + esc(c.v) + '</span></td>'; }).join('') + '<td>' + (r.xt ? '<button class="' + r.xc + '" onclick="' + on(r.tog) + '">' + esc(r.xt) + '</button>' : '') + '</td></tr>'; }).join('') +
      '</tbody></table>' + (v.mMore ? '<div class="nt">' + esc(v.mMore) + '</div>' : '') + '</div><div class="nt">' + esc(v.mFoot) + '</div></div></div>';
  }
};

App.start();
</script>
